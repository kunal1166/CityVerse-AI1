<!doctype html>
<html lang="en" class="h-full bg-[#F4F6F8]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityVerse AI | Smart City Command Center</title>
    <link rel="icon" href="public/pwa-192x192.png">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="Real-time urban operations command center for Taipei City." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Apply saved/preferred theme before first paint to avoid a light-mode flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cityverse-theme');
          var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full font-['Inter',sans-serif] text-gray-900 dark:text-slate-100 bg-[#F4F6F8] dark:bg-slate-950 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-300">
    <div id="root" class="h-full"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] Service Worker registered:', reg.scope))
            .catch((err) => console.error('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
